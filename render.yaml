services:
  - type: web
    name: hostist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 100 --bind 0.0.0.0:$PORT app:app
    plan: starter
    disk:
      name: hostist-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ABYSS_SECRET
        generateValue: true
      - key: ABYSS_DATA_DIR
        value: /var/data
